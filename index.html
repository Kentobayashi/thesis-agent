<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Thesis Analyst</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d0f12;
    --surface: #13161b;
    --border: #252932;
    --accent: #c8a96e;
    --text: #e8eaf0;
    --text2: #8b919e;
    --text3: #5a6070;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--text2);
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .card {
    max-width: 460px;
    text-align: center;
  }
  .logo-icon {
    width: 52px; height: 52px;
    margin: 0 auto 24px;
    background: linear-gradient(135deg, #c8a96e, #e8c98a);
    border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    font-size: 26px;
  }
  h1 {
    font-family: 'DM Serif Display', serif;
    font-size: 28px;
    color: var(--text);
    font-weight: 400;
    margin-bottom: 14px;
  }
  p {
    font-size: 15px;
    line-height: 1.7;
  }
  .tag {
    display: inline-block;
    margin-top: 28px;
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    color: var(--text3);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 5px 14px;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="logo-icon">📖</div>
    <h1>Thesis Analyst</h1>
    <p>Diese Beta ist derzeit nicht öffentlich verfügbar.</p>
    <span class="tag">Beta · pausiert</span>
  </div>
</body>
</html>
